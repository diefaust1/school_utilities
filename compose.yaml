services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: auto_grader
      POSTGRES_USER: auto_grader
      POSTGRES_PASSWORD: auto_grader
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auto_grader -d auto_grader"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: auto_grader
      POSTGRES_USER: auto_grader
      POSTGRES_PASSWORD: auto_grader
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  postgres_data:
