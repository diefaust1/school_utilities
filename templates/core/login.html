{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Grader | Login</title>
    <link rel="stylesheet" href="{% static 'core/app.css' %}">
    <script src="{% static 'core/auth.js' %}" defer></script>
  </head>
  <body class="login-body">
    <main class="login-shell">
      <section class="login-card" aria-labelledby="login-title">
        <p class="eyebrow">School Utilities</p>
        <h1 id="login-title">Auto Grader</h1>
        <p class="intro">Sign in to access your exams and grading workspace.</p>

        {% if error %}
          <p class="form-error" role="alert">{{ error }}</p>
        {% endif %}

        <form class="form-stack auth-form" method="post">
          {% csrf_token %}
          <label for="email">E-mail address</label>
          <input id="email" name="email" type="email" value="{{ email }}" autocomplete="email" required>

          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>

          <button class="primary-button" type="submit">Sign in</button>
        </form>

        <p class="notice">New student? <a href="{% url 'registration' %}">Create an account</a></p>
      </section>
    </main>
  </body>
</html>
